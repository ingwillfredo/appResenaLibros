<div class="container">
    <div class="row">
        <a [routerLink]="['/inicio']" *ngIf="!active">Iniciar Sesión</a>
        <a [routerLink]="['/books']">Libros</a>
        <a [routerLink]="['/add-book']" *ngIf="canCreateBook && !isAddBookRoute">Agregar Libro</a>
        <a routerLink="/books" *ngIf="isAddBookRoute">Volver a Libros</a>
        <a [routerLink]="['/']" (click)="LoginOut()" *ngIf="active">Cerrar Sesión</a>
    </div>
    <div class="row-user" *ngIf="active">
        <h6 class="card-user">{{ userName }}</h6>
    </div>
</div>
